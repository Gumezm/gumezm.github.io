<div class="gallery-lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-label="照片预览" hidden>
  <button type="button" class="gallery-lb-btn gallery-lb-close" aria-label="关闭">&times;</button>
  <button type="button" class="gallery-lb-btn gallery-lb-prev" aria-label="上一张">&#10094;</button>
  <button type="button" class="gallery-lb-btn gallery-lb-next" aria-label="下一张">&#10095;</button>
  <figure class="gallery-lb-stage">
    <img id="gallery-lb-img" alt="" decoding="async">
    <figcaption>
      <span id="gallery-lb-meta"></span>
      <span id="gallery-lb-caption"></span>
    </figcaption>
  </figure>
</div>

<script>
  (function () {
    const page = document.querySelector('.gallery-page');
    if (!page) return;

    const cards = Array.from(document.querySelectorAll('.gallery-card'));
    const chips = Array.from(document.querySelectorAll('.gallery-chip'));
    const empty = document.querySelector('.gallery-empty');
    const groups = Array.from(document.querySelectorAll('.gallery-year-group'));
    const lightbox = document.getElementById('gallery-lightbox');
    const lbImg = document.getElementById('gallery-lb-img');
    const lbMeta = document.getElementById('gallery-lb-meta');
    const lbCaption = document.getElementById('gallery-lb-caption');
    const lbPrev = lightbox.querySelector('.gallery-lb-prev');
    const lbNext = lightbox.querySelector('.gallery-lb-next');

    const state = { tag: '' };
    let visibleLinks = [];
    let currentIndex = 0;

    const splitAttr = (el, name) => (el.dataset[name] || '').split('|').filter(Boolean);

    function matches(card) {
      return !state.tag || splitAttr(card, 'tags').includes(state.tag);
    }

    function syncUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('category'); // 相册分类已停用，清掉旧链接里的参数
      if (state.tag) url.searchParams.set('tag', state.tag);
      else url.searchParams.delete('tag');
      history.replaceState(null, '', url);
    }

    function refresh() {
      let shown = 0;
      cards.forEach((card) => {
        const ok = matches(card);
        card.hidden = !ok;
        if (ok) shown += 1;
      });

      groups.forEach((group) => {
        group.hidden = !group.querySelector('.gallery-card:not([hidden])');
      });

      if (empty) empty.hidden = shown > 0;

      chips.forEach((chip) => {
        const active = (state[chip.dataset.filter] || '') === chip.dataset.value;
        chip.classList.toggle('is-active', active);
        chip.setAttribute('aria-pressed', active ? 'true' : 'false');
      });

      syncUrl();
    }

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        state[chip.dataset.filter] = chip.dataset.value;
        refresh();
      });
    });

    function currentList() {
      return Array.from(document.querySelectorAll('.gallery-card:not([hidden]) .gallery-link'));
    }

    function renderLightbox(index) {
      visibleLinks = currentList();
      if (!visibleLinks.length) return;
      currentIndex = (index + visibleLinks.length) % visibleLinks.length;
      const link = visibleLinks[currentIndex];

      lbImg.onload = () => {
        lbImg.classList.remove('gallery-lb-fade');
        void lbImg.offsetWidth;
        lbImg.classList.add('gallery-lb-fade');
      };
      lbImg.src = link.dataset.full;
      lbImg.alt = link.dataset.caption || '照片';
      lbMeta.textContent = [link.dataset.taken, link.dataset.tags].filter(Boolean).join(' · ');
      lbCaption.textContent = link.dataset.caption || '';
      lbPrev.hidden = lbNext.hidden = visibleLinks.length < 2;

      const next = visibleLinks[(currentIndex + 1) % visibleLinks.length];
      if (next && next !== link) new Image().src = next.dataset.full;
    }

    function openLightbox(link) {
      visibleLinks = currentList();
      const index = visibleLinks.indexOf(link);
      renderLightbox(index < 0 ? 0 : index);
      lightbox.hidden = false;
      document.body.classList.add('gallery-lb-open');
      lightbox.querySelector('.gallery-lb-close').focus();
    }

    function closeLightbox() {
      lightbox.hidden = true;
      document.body.classList.remove('gallery-lb-open');
      lbImg.onload = null;
      lbImg.removeAttribute('src');
      lbImg.classList.remove('gallery-lb-fade');
    }

    document.querySelectorAll('.gallery-link').forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        openLightbox(link);
      });
    });

    lightbox.querySelector('.gallery-lb-close').addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => renderLightbox(currentIndex - 1));
    lbNext.addEventListener('click', () => renderLightbox(currentIndex + 1));

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (event) => {
      if (lightbox.hidden) return;
      if (event.key === 'Escape') closeLightbox();
      else if (event.key === 'ArrowLeft') renderLightbox(currentIndex - 1);
      else if (event.key === 'ArrowRight') renderLightbox(currentIndex + 1);
    });

    let touchStartX = null;
    lightbox.addEventListener('touchstart', (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    lightbox.addEventListener('touchend', (event) => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 50) renderLightbox(currentIndex + (delta < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive: true });

    const params = new URLSearchParams(window.location.search);
    state.tag = params.get('tag') || '';
    const tagValues = chips.filter((c) => c.dataset.filter === 'tag').map((c) => c.dataset.value);
    if (state.tag && !tagValues.includes(state.tag)) state.tag = '';

    refresh();
  })();
</script>
